apiVersion: apps/v1
kind: Deployment
metadata:
  name: set11-github-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: set11-github-app
  template:
    metadata:
      labels:
        app: set11-github-app
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80